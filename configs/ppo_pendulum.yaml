algorithm: ppo
environment: Pendulum-v1
total_steps: 500000
evaluation_interval: 20000
evaluation_episodes: 10
device: cpu
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  num_envs: 1
  rollout_steps: 1024
  update_epochs: 10
  minibatch_size: 64
  max_grad_norm: 0.5
  target_kl: 0.03
  hidden_sizes: [64, 64]
